name: ogre-meshviewer
version: "26.11"
confinement: strict
summary: OGRE Mesh Viewer
description: Viewer for .mesh model files as consumed by OGRE
base: core24
title: OGRE Mesh Viewer
license: MIT
issues: https://github.com/OGRECave/ogre-meshviewer/issues
source-code: https://github.com/OGRECave/ogre-meshviewer
website: https://github.com/OGRECave/ogre-meshviewer

plugs:
  gpu-2404:
    interface: content
    target: $SNAP/gpu-2404
    default-provider: mesa-2404

layout:
  /usr/share/libdrm:
    bind: $SNAP/gpu-2404/libdrm
  /usr/share/drirc.d:
    symlink: $SNAP/gpu-2404/drirc.d
  /usr/share/X11/XErrorDB:
    symlink: $SNAP/gpu-2404/X11/XErrorDB

apps:
    ogre-meshviewer:
        command: bin/gpu-2404-wrapper python3 $SNAP/bin/ogre_mesh_viewer.py
        plugs: [home, opengl, x11, removable-media]
        environment:
            PYTHONPATH: $SNAP/usr/lib/python3.12/:$SNAP/usr/lib/python3.12/dist-packages/:$SNAP/usr/lib/python3.12/lib-dynload
            TCL_LIBRARY: $SNAP/usr/share/tcltk/tcl8.6
            XDG_DATA_DIRS: $SNAP/usr/share:$XDG_DATA_DIRS
            XDG_CACHE_HOME: $SNAP_USER_COMMON/.cache
parts:
    assimp:
        plugin: cmake
        cmake-parameters:
            - -DCMAKE_BUILD_TYPE=Release
            - -DASSIMP_BUILD_TESTS=OFF
            - -DASSIMP_NO_EXPORT=TRUE
            - -DASSIMP_BUILD_OGRE_IMPORTER=OFF
            - -DASSIMP_BUILD_ASSIMP_TOOLS=OFF
            - -DCMAKE_INSTALL_PREFIX=/usr/
            - -DCMAKE_CXX_COMPILER=/usr/bin/clang++-20
        source: https://github.com/assimp/assimp.git
        source-tag: v6.0.4
        source-depth: 1
        build-packages:
            - clang-20
    ogre:
        plugin: cmake
        cmake-parameters:
            - -DCMAKE_BUILD_TYPE=Release
            - -DOGRE_BUILD_DEPENDENCIES=FALSE
            - -DOGRE_BUILD_RENDERSYSTEM_GL3PLUS=TRUE
            - -DOGRE_BUILD_RENDERSYSTEM_GL=TRUE
            - -DOGRE_BUILD_RENDERSYSTEM_GLES2=TRUE
            - -DOGRE_BUILD_PLUGIN_RSIMAGE=TRUE
            - -DOGRE_BUILD_COMPONENT_PYTHON=TRUE
            - -DOGRE_BUILD_PLUGIN_DOT_SCENE=TRUE
            - -DOGRE_BUILD_COMPONENT_TERRAIN=TRUE
            - -DOGRE_BUILD_COMPONENT_PAGING=TRUE
            - -DPYTHON_EXECUTABLE=/usr/bin/python3
            # stuff we dont need for the viewer
            - -DOGRE_BUILD_TOOLS=FALSE
            - -DOGRE_BUILD_SAMPLES=FALSE
            - -DOGRE_BUILD_PLUGIN_STBI=FALSE # we want to use rsimage instead
            - -DOGRE_BUILD_PLUGIN_FREEIMAGE=FALSE
            - -DOGRE_BUILD_PLUGIN_EXRCODEC=FALSE
            - -DOGRE_BUILD_PLUGIN_BSP=FALSE
            - -DOGRE_BUILD_PLUGIN_PCZ=FALSE
            - -DOGRE_BUILD_PLUGIN_OCTREE=FALSE
            - -DOGRE_BUILD_COMPONENT_JAVA=FALSE
            - -DOGRE_BUILD_COMPONENT_CSHARP=FALSE
            - -DOGRE_BUILD_COMPONENT_VOLUME=FALSE
            - -DOGRE_BUILD_COMPONENT_PROPERTY=FALSE
            - -DOGRE_BUILD_COMPONENT_MESHLODGENERATOR=FALSE
            - -DCMAKE_INSTALL_PREFIX=/usr/
            - -DCMAKE_CXX_COMPILER=/usr/bin/clang++-20
        source: https://github.com/OGRECave/ogre.git
        source-tag: v14.6.3
        source-depth: 1
        build-environment:
            - CMAKE_PREFIX_PATH: $SNAPCRAFT_STAGE/usr
        build-packages:
            - libxrandr-dev
            - libfreetype6-dev
            - libgles2-mesa-dev
            - libsdl2-dev
            - libpython3-dev
            - libpugixml-dev
            - swig
            - clang-20
            - cargo
            - on amd64: [nvidia-cg-dev]
        stage-packages:
            - libfreetype6
            - libsdl2-2.0-0
            - python3
            - python3-tk
            - libpython3.12t64
            - libpugixml1v5
            - libsm6
            - on amd64: [libcggl]
        after: [assimp]
        # libpulse.so.0 has a hardcoded RUNPATH of /usr/lib/<triplet>/pulseaudio,
        # which does not exist inside a strict snap, and libpulsecommon lives
        # only in that directory. $SNAP/usr/lib is on the default
        # LD_LIBRARY_PATH, so move it there instead of hardcoding an arch path.
        organize:
            "usr/lib/*/pulseaudio/libpulsecommon-*": usr/lib/
    viewer:
        plugin: dump
        source: https://github.com/OGRECave/ogre-meshviewer.git
        organize:
            ogre_mesh_viewer.py: bin/
            fonts: bin/fonts
        stage:
            - bin/
        after: [ogre]
    gpu-2404:
        after: [ogre]
        source: https://github.com/canonical/gpu-snap.git
        source-commit: 84e56217ec137c3f8d7a0e773bb7c39c8fc40f28
        plugin: dump
        override-prime: |
          craftctl default
          ${CRAFT_PART_SRC}/bin/gpu-2404-cleanup mesa-2404
        prime:
          - bin/gpu-2404-wrapper
